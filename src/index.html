<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>aframe chromakey image target</title>
  <meta itemprop="name" content="aframe chromakey image target">
  <meta name="twitter:title" content="aframe chromakey image target">
  <meta property="og:title" content="aframe chromakey image target">
  <meta property="og:site_name" content="aframe chromakey image target">
  <meta name="description" content="">
  <meta itemprop="description" content="">
  <meta property="og:description" content="">
  <meta property="og:image" content="https://evanmcarlson.github.io/aframe-chromakey-image-target/assets/demo.png">
  <meta name="twitter:description" content="">
  <script crossorigin="anonymous" src="./external/scripts/8frame-1.4.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  </script>

<meta name="apple-mobile-web-app-capable" content="yes"/>

<script src="//cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.7/dat.gui.min.js" crossorigin="anonymous"></script>

</head>

<body>
<script src="bundle.js"></script>

<a-scene
  xrextras-tap-recenter
  landing-page="backgroundColor: #000;"
  xrextras-loading
  xrextras-runtime-error
  xrextras-gesture-detector
  xrweb="allowedDevices: any">
  <a-assets>
    <video id="collage1" src="./assets/collage1.mp4" muted loop></video>
  </a-assets>

  <a-entity
    light="
      type: directional; 
      castShadow: true; 
      color: white; 
      intensity: 0.5"
    position="5 10 7">
  </a-entity>

  <a-light type="ambient" intensity="0.5"></a-light>

  <a-camera position="0 2 2"></a-camera>

  <xrextras-named-image-target name="collage1">
    <a-plane
      width="0.748"
      chromakey-video="src: #collage1; color: 0x0; similarity: 0; smoothness: 0.161; spill: 0;"></a-plane>
  </xrextras-named-image-target>

  <a-plane
    height="2000"
    width="2000"
    rotation="-90 0 0"
    material="shader: shadow; opacity: 0.67"
    shadow>
  </a-plane>
</a-scene>

</body>

</html>
